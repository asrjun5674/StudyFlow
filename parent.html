<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyFlow — Parent</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f8fc;color:#171923}.top{padding:23px 5vw;color:#fff;background:linear-gradient(135deg,#6d5dfc,#8e7dff)}.wrap{max-width:1030px;margin:22px auto;padding:0 18px}.card{background:#fff;border:1px solid #e7e9f0;border-radius:20px;padding:20px;box-shadow:0 9px 30px #28315c0b}.auth{max-width:460px;margin:52px auto}.hide{display:none}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.muted{font-size:13px;color:#6b7280}.dark{background:#141622;color:#fff;border:0;border-radius:12px;padding:11px 14px;font-weight:850;cursor:pointer}.primary{background:#6d5dfc;color:#fff;border:0;border-radius:12px;padding:11px 14px;font-weight:850;cursor:pointer}.soft{background:#efedff;color:#4839b1;border:0;border-radius:12px;padding:11px 14px;font-weight:850;cursor:pointer}input{width:100%;padding:11px;border:1px solid #e7e9f0;border-radius:12px;font:inherit;margin:6px 0 12px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.kpi{border:1px solid #e7e9f0;border-radius:15px;padding:13px}.kpi b{display:block;font-size:23px}.progress{height:11px;background:#eceef4;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:#6d5dfc;transition:.3s}.day{border:1px solid #e7e9f0;border-radius:16px;padding:15px;margin-top:12px}.daytitle{display:flex;justify-content:space-between}.task{padding:9px 0;border-top:1px solid #e7e9f0}.task:first-child{border-top:0}.done{color:#16803d}.code{font-size:26px;letter-spacing:5px}@media(max-width:800px){.kpis{grid-template-columns:1fr 1fr}}
</style></head>
<body>
<header class="top"><div class="row between"><div><h1 style="margin:0">👨‍👩‍👧 StudyFlow Parent</h1><div>Live student progress</div></div><div class="row"><a href="index.html" style="color:white;text-decoration:none">Home</a><button class="dark" id="logout">Log out</button></div></div></header>
<div class="wrap">
<section id="auth" class="card auth"><h2>Parent Login</h2><p class="muted">Your session stays remembered on this browser.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (6+ characters)"><div class="row"><button class="primary" id="signup">Create account</button><button class="soft" id="signin">Log in</button></div><p id="authMsg" class="muted"></p></section>
<section id="app" class="hide">
<div class="card"><h2 style="margin-top:0">Connect your child</h2><p class="muted">Enter the 6-digit code shown in the Student App.</p><div class="row"><input id="code" maxlength="6" inputmode="numeric" placeholder="123456" style="max-width:240px;font-size:25px;letter-spacing:4px"><button class="primary" id="connect">Connect</button></div><p id="linkMsg" class="muted"></p></div>
<div id="dash" class="card hide" style="margin-top:18px"><div class="row between"><div><h2 id="student" style="margin-bottom:3px">Student</h2><p id="updated" class="muted"></p></div></div><div class="kpis"><div class="kpi">Progress<b id="pct">0%</b></div><div class="kpi">Completed<b id="done">0</b></div><div class="kpi">Remaining<b id="remaining">0</b></div><div class="kpi">Study days<b id="days">0</b></div></div><div style="margin:15px 0 5px">Overall progress</div><div class="progress"><div id="bar" style="width:0"></div></div><div id="list"></div></div>
</section></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,setPersistence,browserLocalPersistence} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);await setPersistence(auth,browserLocalPersistence);const $=x=>document.getElementById(x);let user,unsub;
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
$("signup").onclick=async()=>{try{let c=await createUserWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);await setDoc(doc(db,"users",c.user.uid),{uid:c.user.uid,role:"parent",email:c.user.email,createdAt:serverTimestamp()});$("authMsg").textContent="Parent account created ✓"}catch(e){$("authMsg").textContent=e.message}};
$("signin").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);$("authMsg").textContent=""}catch(e){$("authMsg").textContent=e.message}};$("logout").onclick=()=>signOut(auth);
$("connect").onclick=async()=>{const code=$("code").value.trim();try{if(!/^\\d{6}$/.test(code))throw Error("Enter a 6-digit code.");const s=await getDoc(doc(db,"pairingCodes",code));if(!s.exists())throw Error("Invalid code.");const d=s.data();if(!d.expiresAt||d.expiresAt.toMillis()<Date.now()||d.claimedBy)throw Error("This code has expired or was already used.");await setDoc(doc(db,"links",d.studentUid+"_"+user.uid),{studentUid:d.studentUid,parentUid:user.uid,pairingCode:code,createdAt:serverTimestamp()});await setDoc(doc(db,"pairingCodes",code),{claimedBy:user.uid,claimedAt:serverTimestamp()},{merge:true});$("linkMsg").textContent="Connected ✓";watch(d.studentUid)}catch(e){$("linkMsg").textContent=e.message}};
function watch(uid){unsub?.();$("dash").classList.remove("hide");unsub=onSnapshot(doc(db,"plans",uid),s=>{if(!s.exists()){$("linkMsg").textContent="Connected, but the student has not created a plan yet.";return}const d=s.data(),all=(d.plan||[]).flatMap(x=>x.tasks||[]),done=all.filter(x=>x.done).length,p=all.length?Math.round(done/all.length*100):0;$("student").textContent=d.student||"Student";$("updated").textContent="Live Firebase sync";$("pct").textContent=p+"%";$("done").textContent=done;$("remaining").textContent=all.length-done;$("days").textContent=d.days||0;$("bar").style.width=p+"%";$("list").innerHTML=(d.plan||[]).map(x=>`<div class="day"><div class="daytitle"><b>Day ${x.day} <span class="muted">${esc(x.date)}</span></b><span class="muted">${x.tasks.filter(t=>t.done).length}/${x.tasks.length}</span></div>${x.tasks.map(t=>`<div class="task ${t.done?"done":""}">${t.done?"✅":"⬜"} <b>${esc(t.subject)}</b> — ${esc(t.name)} <span class="muted">${t.minutes||30}m</span></div>`).join("")}</div>`).join("")})}
onAuthStateChanged(auth,u=>{user=u;if(!u){$("auth").classList.remove("hide");$("app").classList.add("hide")}else{$("auth").classList.add("hide");$("app").classList.remove("hide")}});
</script></body></html>
